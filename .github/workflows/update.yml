name: Actualizar informe ATIA

on:
  schedule:
    - cron: "0 * * * *"   # cada hora, en punto (hora UTC)
  workflow_dispatch: {}    # botón "Run workflow" para probarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar data.json desde Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node generate.mjs

      - name: Publicar cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios desde la última vez, no hace falta publicar nada."
          else
            git commit -m "Actualizar datos de averías ATIA"
            git push
          fi
