# Configuración del Worker de Cloudflare que borra avisos en Airtable.
# Cloudflare construye y despliega este Worker automáticamente en cada push
# a main (Workers Builds), leyendo el código de cloudflare-worker.js.
#
# Los dos secretos (DELETE_PASSWORD y AIRTABLE_TOKEN) NO van aquí: se
# configuran en el panel de Cloudflare y nunca se guardan en el repositorio.

name = "atia-borrar"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-01"
